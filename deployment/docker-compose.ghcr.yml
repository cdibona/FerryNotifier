# Run the pre-built image published to GitHub Container Registry.
# Usage:
#   docker compose -f deployment/docker-compose.ghcr.yml pull
#   docker compose -f deployment/docker-compose.ghcr.yml up -d
#
# While the package is private, first authenticate:
#   echo $GHCR_PAT | docker login ghcr.io -u <github-username> --password-stdin
# (GHCR_PAT is a GitHub token with read:packages scope.)

services:
  ferrynotifier:
    image: ghcr.io/cdibona/ferrynotifier:latest
    container_name: ferrynotifier
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - ../.env
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5050
    # Persist settings (targets, keys, schedules) across restarts.
    volumes:
      - ferry-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ferry-data:
