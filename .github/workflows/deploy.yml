name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Run tests on all pushes and PRs
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'web/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt

      - name: Run tests
        env:
          WSDOT_API_KEY: test_key_for_ci
        run: |
          cd web
          python test_app.py

  # Build Docker image and verify it works
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: ferrytrmnl:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging on push to main
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN || 'staging.ferry.example.com' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/FerryTrmnl
            git fetch origin main
            git reset --hard origin/main

            # Update virtual environment
            source venv/bin/activate
            pip install -r web/requirements.txt

            # Restart service
            sudo systemctl restart ferrytrmnl

            # Wait for service to start
            sleep 5

            # Health check
            curl -f http://localhost:5050/health || exit 1

            echo "Staging deployment complete"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Staging deployment successful"
          else
            echo "Staging deployment failed"
          fi

  # Deploy to production on tag/release or manual trigger
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: |
      (startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN || 'ferry.example.com' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/FerryTrmnl

            # Backup current version
            BACKUP_DIR="/opt/FerryTrmnl-backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            cp -r web "$BACKUP_DIR/"

            # Pull latest changes
            git fetch origin
            if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
              git checkout ${{ github.ref_name }}
            else
              git reset --hard origin/main
            fi

            # Update virtual environment
            source venv/bin/activate
            pip install -r web/requirements.txt

            # Restart service with zero-downtime reload
            sudo systemctl reload-or-restart ferrytrmnl

            # Wait for service to start
            sleep 5

            # Health check
            curl -f http://localhost:5050/health || {
              echo "Health check failed, rolling back..."
              cp -r "$BACKUP_DIR/web" /opt/FerryTrmnl/
              sudo systemctl restart ferrytrmnl
              exit 1
            }

            echo "Production deployment complete"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Production deployment successful"
          else
            echo "Production deployment failed"
          fi

  # Docker deployment option (alternative to direct server deployment)
  deploy-docker:
    name: Deploy with Docker
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: |
            ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}:${{ github.sha }}
            ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Docker host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DOCKER_HOST }}
          username: ${{ secrets.DOCKER_USER }}
          key: ${{ secrets.DOCKER_SSH_KEY }}
          script: |
            cd /opt/FerryTrmnl

            # Pull latest image
            docker pull ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}:${{ github.sha }}

            # Update docker-compose with new image
            cd deployment
            docker-compose pull
            docker-compose up -d

            # Health check
            sleep 10
            curl -f http://localhost:5050/health || exit 1

            # Cleanup old images
            docker image prune -f

            echo "Docker deployment complete"
